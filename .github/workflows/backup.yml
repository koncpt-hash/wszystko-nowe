name: Kopia bazy

# Co tydzień zapisuje pełną kopię tabel z Supabase do folderu backup/ w tym repozytorium.
# Wymaga sekretów repozytorium: SUPABASE_URL i SUPABASE_SERVICE_ROLE_KEY
# (GitHub → Settings → Secrets and variables → Actions → New repository secret).

on:
  schedule:
    - cron: "41 4 * * 2"   # wtorek, ok. 5:41–6:41 czasu polskiego
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz tabele
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          URL="$(printf '%s' "$URL" | tr -d '[:space:]')"; URL="${URL%/}"
          KEY="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          mkdir -p backup
          for t in places routes photo_sessions photos; do
            AUTH=()
            case "$KEY" in sb_*) ;; *) AUTH=(-H "Authorization: Bearer $KEY") ;; esac
            code=$(curl -s -o "backup/$t.raw" -w '%{http_code}' "$URL/rest/v1/$t?select=*" \
              -H "apikey: $KEY" "${AUTH[@]}")
            if [ "$code" != "200" ]; then
              echo "Tabela $t: HTTP $code"; head -c 400 "backup/$t.raw"; echo
              exit 1
            fi
            python3 -m json.tool --indent 1 "backup/$t.raw" > "backup/$t.json"
            rm "backup/$t.raw"
          done
      - name: Zapisz zmiany
        run: |
          git config user.name "kopia-bazy"
          git config user.email "actions@users.noreply.github.com"
          git add backup
          git diff --cached --quiet || git commit -m "Kopia bazy $(date +%F)"
          git push
