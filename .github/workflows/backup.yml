name: Kopia bazy

# Co tydzień zapisuje pełną kopię tabel z Supabase do folderu backup/ w tym repozytorium.
# Wymaga sekretów repozytorium: SUPABASE_URL i SUPABASE_SERVICE_ROLE_KEY
# (GitHub → Settings → Secrets and variables → Actions → New repository secret).

on:
  schedule:
    - cron: "41 4 * * 2"   # wtorek, ok. 5:41–6:41 czasu polskiego
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz tabele
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          mkdir -p backup
          for t in places routes photo_sessions photos; do
            curl -sf "$URL/rest/v1/$t?select=*" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              | python3 -m json.tool --indent 1 > "backup/$t.json"
          done
      - name: Zapisz zmiany
        run: |
          git config user.name "kopia-bazy"
          git config user.email "actions@users.noreply.github.com"
          git add backup
          git diff --cached --quiet || git commit -m "Kopia bazy $(date +%F)"
          git push
